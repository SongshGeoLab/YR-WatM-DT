      <!-- Suppress Firefox deprecation warnings for MouseEvent.mozPressure and MouseEvent.mozInputSource -->
      <script>
        // Suppress Firefox deprecation warnings for Leaflet compatibility
        const originalWarn = console.warn;
        console.warn = function(...args) {
          const message = args.join(' ');
          if (message.includes('MouseEvent.mozPressure') || message.includes('MouseEvent.mozInputSource')) {
            return; // Suppress these specific warnings
          }
          originalWarn.apply(console, args);
        };
      </script>
